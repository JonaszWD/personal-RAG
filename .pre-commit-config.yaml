repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --extra tui ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --extra tui ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run --extra tui mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: no-personal-files
        name: block personal documents / screenshots / .env
        entry: bash -c 'git diff --cached --name-only | grep -E "(^documents/|\.pdf$|^Screenshot|(^|/)\.env$)" && { echo "refusing to commit personal files"; exit 1; } || exit 0'
        language: system
        pass_filenames: false
        always_run: true
